name: Deploy Viper Prospector

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: viper-next/package-lock.json

      - name: Install
        run: cd viper-next && npm ci

      - name: Build
        run: cd viper-next && npm run build

      - name: Add .nojekyll
        run: touch viper-next/out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: viper-next/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
